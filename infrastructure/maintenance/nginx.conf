# Every path answers 503: pages get the maintenance page, which polls until the site answers 200.
# X-Maintenance tells open tabs (web/src/api/outage.ts) the API never saw the request, so it is safe to resend.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Maintenance 1 always;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;

    error_page 503 /index.html;

    location = /index.html {
        internal;
    }

    location /api/ {
        default_type application/problem+json;
        return 503 '{"type":"https://tools.ietf.org/html/rfc9110#section-15.6.4","title":"Skoleoverblikket opdateres. Prøv igen om lidt.","status":503}';
    }

    location / {
        return 503;
    }
}

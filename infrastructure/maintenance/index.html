<!DOCTYPE html>
<!--
  Shown for every path on skoleoverblikket.dk while the web container is being replaced (ProdCompose.Maintenance).
  Keep it self-contained: the site's fonts, images and scripts are down while this page shows.
-->
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opdaterer… · Skoleoverblikket</title>
<style>
  :root { --brand: #1f6321; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #f0f5f1; color: var(--ink);
    font: 16px/1.5 Lato, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { width: 100%; max-width: 520px; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--brand); font: 700 20px/1 Georgia, serif; margin-bottom: 28px; }
  .brand svg { width: 26px; height: auto; }

  .week {
    background: #fff; border-radius: 14px; padding: 14px; margin: 0 auto 28px;
    box-shadow: 0 1px 3px rgb(0 0 0 / .06), 0 10px 30px rgb(31 99 33 / .08);
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
  }
  .day { font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
  .slot { height: 34px; border-radius: 6px; background: #f3f4f6; position: relative; overflow: hidden; }
  .lesson {
    position: absolute; inset: 0; display: grid; place-items: center; border-radius: 6px;
    font-size: 12px; font-weight: 700; opacity: 0; transform: scale(.6);
    transition: opacity .35s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  .slot.on .lesson { opacity: 1; transform: scale(1); }

  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 6px; color: var(--muted); }
  .foot { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
  .status { font-size: 14px; color: var(--muted); min-width: 170px; }
  button {
    border: 0; background: var(--brand); color: #fff; font: inherit; font-size: 15px; font-weight: 700;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #174d19; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .lesson { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 100 140" aria-hidden="true">
      <path d="M6 48 50 6l44 42" fill="none" stroke="currentColor" stroke-width="7"/>
      <rect x="12" y="58" width="76" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="7"/>
      <path d="M38 60v72M62 60v72M14 84h72M14 108h72" stroke="#7db87d" stroke-width="4"/>
    </svg>
    Skoleoverblikket
  </div>

  <div class="week" data-week aria-hidden="true">
    <div class="day">Man</div><div class="day">Tir</div><div class="day">Ons</div><div class="day">Tor</div><div class="day">Fre</div>
  </div>

  <h1>Skemaet bliver lagt på plads</h1>
  <p>Vi er ved at opdatere Skoleoverblikket. Det tager som regel under et minut.</p>
  <p>Siden genindlæser selv, når vi er klar. Intet af det, du har gemt, går tabt.</p>

  <div class="foot">
    <span class="status" data-status aria-live="polite"></span>
    <button type="button" data-retry>Prøv igen nu</button>
  </div>
</main>

<script>
  // Decorative timetable: lessons pop in at random, then the week clears and starts over.
  (() => {
    const week = document.querySelector("[data-week]");
    const subjects = [
      ["Da", "#dcfce7", "#166534"], ["Ma", "#dbeafe", "#1e40af"], ["En", "#fef3c7", "#92400e"],
      ["Na", "#ede9fe", "#5b21b6"], ["Id", "#ffe4e6", "#9f1239"], ["Mu", "#cffafe", "#155e75"],
      ["Hi", "#fae8ff", "#86198f"], ["Bi", "#d9ead9", "#174d19"],
    ];
    const slots = [];
    for (let i = 0; i < 25; i++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.innerHTML = '<div class="lesson"></div>';
      week.append(slot);
      slots.push(slot);
    }
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function paint(slot) {
      const [label, bg, fg] = subjects[Math.floor(Math.random() * subjects.length)];
      const lesson = slot.firstChild;
      lesson.textContent = label;
      lesson.style.background = bg;
      lesson.style.color = fg;
      slot.classList.add("on");
    }

    if (reduced) {
      slots.forEach((s, i) => { if (i % 3 !== 2) paint(s); });
      return;
    }
    let order = [];
    setInterval(() => {
      if (!order.length) {
        slots.forEach((s) => s.classList.remove("on"));
        order = slots.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 19);
        return;
      }
      paint(slots[order.pop()]);
    }, 220);
  })();

  // Polls the current URL with growing gaps. The fallback answers 503; the real site answers 200.
  (() => {
    const delays = [2, 3, 5, 8, 13, 20, 30];
    const status = document.querySelector("[data-status]");
    let attempt = 0, left = 0, timer = 0, busy = false;

    const say = (text) => { status.textContent = text; };

    async function check() {
      if (busy) return;
      busy = true;
      clearInterval(timer);
      say("Tjekker…");
      try {
        const res = await fetch(location.href, { cache: "no-store" });
        if (res.ok) {
          say("Klar! Genindlæser…");
          setTimeout(() => location.reload(), 700);
          return;
        }
      } catch {}
      busy = false;
      schedule();
    }

    function schedule() {
      const base = delays[Math.min(attempt++, delays.length - 1)];
      left = Math.max(1, Math.round(base * (0.85 + Math.random() * 0.3)));
      tick();
      timer = setInterval(tick, 1000);
    }

    function tick() {
      if (left <= 0) return check();
      say(`Prøver igen om ${left} sek.`);
      left--;
    }

    document.querySelector("[data-retry]").addEventListener("click", () => { attempt = 0; check(); });
    addEventListener("online", check);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    schedule();
  })();
</script>
</body>
</html>

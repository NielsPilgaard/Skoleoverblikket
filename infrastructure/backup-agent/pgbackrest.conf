# pgBackRest config for the backup agent (task 54 §1, task 60). Secrets and the repo endpoint
# come from PGBACKREST_* env vars set in Dokploy, never from this file:
#   PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_S3_BUCKET,
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# Env vars win over this file, so local dev overrides e.g. the endpoint and TLS check the same way.

[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc

# Daily fulls with time retention 13: the oldest full is 13-14 days old while fulls succeed,
# so no restorable data is older than the 14 days the DPA promises (task 54 retention note).
repo1-retention-full-type=time
repo1-retention-full=13

# Postgres has no archive_mode: WAL is streamed by the agent (task 60 D2). pgBackRest refuses
# a backup that checks the archive without archive_mode (Phase 0, error 087), so the agent checks
# that each backup's WAL reached the repo itself. That also rules out archive-copy.
archive-check=n

compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-stderr=warn
log-level-file=off

[main]
# The live volume is mounted read-only at the path Postgres uses: pgBackRest refuses a pg1-path
# that differs from the server's data_directory (Phase 0, error 058).
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=backup_agent

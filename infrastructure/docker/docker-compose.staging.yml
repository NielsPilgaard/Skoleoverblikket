# Staging stack for CI e2e tests — runs on the GitHub Actions runner.
# Uses the freshly published images. No Traefik; services are exposed on localhost ports.
# All secrets are injected via GitHub Actions environment variables.

name: skoleoverblikket-staging

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: skoleoverblikket
      POSTGRES_PASSWORD: staging-password
      POSTGRES_DB: skoleoverblikket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skoleoverblikket"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak-password
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest}
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: staging-admin-password
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/Skoleoverblikket HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  api:
    image: ${API_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-api:latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__skoleoverblikket-db: Host=postgres;Port=5432;Database=skoleoverblikket;Username=skoleoverblikket;Password=staging-password
      # API validates JWTs internally — use the container-network hostname, not localhost.
      Keycloak__Authority: http://keycloak:8080/realms/Skoleoverblikket
      Keycloak__RequireHttpsMetadata: "false"
      Keycloak__Audience: skoleoverblikket-api
      Keycloak__WebClientId: skoleoverblikket-web
      Keycloak__AdminClientId: skoleoverblikket-admin
      Keycloak__AdminClientSecret: skoleoverblikket-admin-secret
      ObjectStorage__ServiceUrl: http://silo:9000
      ObjectStorage__AccessKey: minioadmin
      ObjectStorage__SecretKey: minioadmin
      ObjectStorage__DefaultBucketName: skoleoverblikket
      ObjectStorage__PublicEndpoint: http://localhost:9000
      ObjectStorage__PresignedUploadSigningKey: stub-signing-key
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Smtp__Username: ""
      Smtp__Password: ""
      App__BaseUrl: http://localhost:5173
      Stripe__SecretKey: sk_test_stub
      Stripe__BasePriceIdMonthly: price_stub_base_monthly
      Stripe__BasePriceIdYearly: price_stub_base_yearly
      Stripe__ModulePriceIds__ParentModule__Monthly: price_stub_parent_monthly
      Stripe__ModulePriceIds__ParentModule__Yearly: price_stub_parent_yearly
      Stripe__ModulePriceIds__BoardModule__Monthly: price_stub_board_monthly
      Stripe__ModulePriceIds__BoardModule__Yearly: price_stub_board_yearly
      Stripe__WebhookSecret: whsec_stub
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s

  silo:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    image: ${WEB_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-web:latest}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

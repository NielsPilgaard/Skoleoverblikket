# GENERATED by scripts/generate-prod-compose.ps1 from infrastructure/aspire/Skoleoverblikket.AppHost
# (Program.cs and ProdCompose.cs). Do not edit by hand: CI fails when this file is stale.
#
# Production stack on the OVH VPS, deployed by Dokploy behind its Traefik. Every ${VAR} is set in
# Dokploy; docs/DEPLOYMENT.md lists them. Postgres and the backup agent only start with
# COMPOSE_PROFILES=selfhosted-db (task 54 cutover).
#
# The external volumes ARE the database. Never delete them. The backup console says which pgdata
# volume is live; wal-receive holds WAL that may not be in the repo yet.
name: "skoleoverblikket"
services:
  postgres:
    image: "ghcr.io/nielspilgaard/skoleoverblikket-postgres:sha-af85693a0235c8490b1ad2736ab30a89c04bf858"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:-}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD:-}"
    volumes:
      - type: "volume"
        target: "/pgdata/a"
        source: "skoleoverblikket-pgdata-a"
        read_only: false
      - type: "volume"
        target: "/pgdata/b"
        source: "skoleoverblikket-pgdata-b"
        read_only: false
      - type: "volume"
        target: "/pg-control"
        source: "skoleoverblikket-pg-control"
        read_only: false
      - type: "volume"
        target: "/var/run/postgresql"
        source: "skoleoverblikket-pg-socket"
        read_only: false
    networks:
      - "dokploy-network"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${POSTGRES_MEMORY:-2g}"
    healthcheck:
      test:
        - "CMD"
        - "pg_isready"
        - "-h"
        - "/var/run/postgresql"
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "30s"
    profiles:
      - "selfhosted-db"
    stop_grace_period: "60s"
  keycloak:
    image: "${KEYCLOAK_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest}"
    command:
      - "start"
      - "--import-realm"
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "${KEYCLOAK_DB_URL}"
      KC_DB_USERNAME: "${KEYCLOAK_DB_USERNAME}"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME: "https://auth.skoleoverblikket.dk"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    networks:
      - "dokploy-network"
    restart: "unless-stopped"
    deploy:
      replicas: 1
      update_config:
        delay: "30s"
        failure_action: "rollback"
        order: "start-first"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"
      interval: "10s"
      timeout: "5s"
      retries: 18
      start_period: "60s"
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.rule: "Host(`auth.skoleoverblikket.dk`)"
      traefik.http.routers.keycloak.entrypoints: "websecure"
      traefik.http.routers.keycloak.tls.certresolver: "letsencrypt"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
  backup-agent:
    image: "ghcr.io/nielspilgaard/skoleoverblikket-backup-agent:sha-af85693a0235c8490b1ad2736ab30a89c04bf858"
    environment:
      Agent__SshTunnelCommand: "${BACKUP_CONSOLE_SSH:-}"
      Agent__VolumeNamePrefix: "skoleoverblikket-pgdata-"
      PGBACKREST_REPO1_S3_ENDPOINT: "${PGBACKREST_REPO1_S3_ENDPOINT:-}"
      PGBACKREST_REPO1_S3_REGION: "${PGBACKREST_REPO1_S3_REGION:-}"
      PGBACKREST_REPO1_S3_BUCKET: "${PGBACKREST_REPO1_S3_BUCKET:-}"
      PGBACKREST_REPO1_S3_KEY: "${PGBACKREST_REPO1_S3_KEY:-}"
      PGBACKREST_REPO1_S3_KEY_SECRET: "${PGBACKREST_REPO1_S3_KEY_SECRET:-}"
      PGBACKREST_REPO1_CIPHER_PASS: "${PGBACKREST_REPO1_CIPHER_PASS:-}"
      OpsBucket__ServiceUrl: "${OpsBucket_ServiceUrl:-}"
      OpsBucket__AccessKey: "${OpsBucket_AccessKey:-}"
      OpsBucket__SecretKey: "${OpsBucket_SecretKey:-}"
      Heartbeats__Wal: "${Heartbeats_Wal:-}"
      Heartbeats__Backup: "${Heartbeats_Backup:-}"
      Heartbeats__Drill: "${Heartbeats_Drill:-}"
      Heartbeats__Verify: "${Heartbeats_Verify:-}"
      Heartbeats__ElmahIo__ApiKey: "${Heartbeats_ElmahIo_ApiKey:-}"
      Heartbeats__ElmahIo__LogId: "${Heartbeats_ElmahIo_LogId:-}"
      Heartbeats__Provider: "${Heartbeats_Provider:-ElmahIo}"
      Heartbeats__Ping__FailSuffix: "${Heartbeats_Ping_FailSuffix:-/fail}"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: "volume"
        target: "/var/run/postgresql"
        source: "skoleoverblikket-pg-socket"
        read_only: false
      - type: "volume"
        target: "/pgdata/a"
        source: "skoleoverblikket-pgdata-a"
        read_only: false
      - type: "volume"
        target: "/pgdata/b"
        source: "skoleoverblikket-pgdata-b"
        read_only: false
      - type: "volume"
        target: "/pg-control"
        source: "skoleoverblikket-pg-control"
        read_only: false
      - type: "volume"
        target: "/wal-receive"
        source: "skoleoverblikket-wal-receive"
        read_only: false
      - type: "volume"
        target: "/var/lib/backup-agent"
        source: "skoleoverblikket-backup-agent-state"
        read_only: false
    networks:
      - "backup-agent"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "${BACKUP_AGENT_MEMORY:-5g}"
    profiles:
      - "selfhosted-db"
    stop_grace_period: "30s"
    tmpfs:
      - "/drill:size=${DRILL_TMPFS_SIZE:-4g},uid=999,gid=999,mode=0700"
  api:
    image: "${API_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-api:latest}"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__skoleoverblikket-db: "${DATABASE_URL}"
      Keycloak__Authority: "https://auth.skoleoverblikket.dk/realms/Skoleoverblikket"
      Keycloak__Audience: "skoleoverblikket-api"
      Keycloak__WebClientId: "${Keycloak_WebClientId}"
      Keycloak__AdminClientId: "${Keycloak_AdminClientId}"
      Keycloak__AdminClientSecret: "${Keycloak_AdminClientSecret}"
      ObjectStorage__ServiceUrl: "${ObjectStorage_ServiceUrl}"
      ObjectStorage__AccessKey: "${ObjectStorage_AccessKey}"
      ObjectStorage__SecretKey: "${ObjectStorage_SecretKey}"
      ObjectStorage__DefaultBucketName: "${ObjectStorage_DefaultBucketName}"
      ObjectStorage__PublicEndpoint: "${ObjectStorage_PublicEndpoint}"
      ObjectStorage__PresignedUploadSigningKey: "${ObjectStorage_PresignedUploadSigningKey}"
      Smtp__Username: "${Smtp_Username}"
      Smtp__Password: "${Smtp_Password}"
      Stripe__SecretKey: "${Stripe_SecretKey}"
      Stripe__WebhookSecret: "${Stripe_WebhookSecret}"
      Stripe__BasePriceIdMonthly: "${Stripe_BasePriceIdMonthly}"
      Stripe__BasePriceIdYearly: "${Stripe_BasePriceIdYearly}"
      Stripe__ModulePriceIds__ParentModule__Monthly: "${Stripe_ModulePriceIds_ParentModule_Monthly}"
      Stripe__ModulePriceIds__ParentModule__Yearly: "${Stripe_ModulePriceIds_ParentModule_Yearly}"
      Stripe__ModulePriceIds__BoardModule__Monthly: "${Stripe_ModulePriceIds_BoardModule_Monthly}"
      Stripe__ModulePriceIds__BoardModule__Yearly: "${Stripe_ModulePriceIds_BoardModule_Yearly}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS}"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      ElmahIo__ApiKey: "${ElmahIo_ApiKey:-}"
      ElmahIo__LogId: "${ElmahIo_LogId:-}"
      BackupStatus__ServiceUrl: "${OpsBucket_ServiceUrl:-https://s3.rbx.io.cloud.ovh.net/}"
      BackupStatus__AccessKey: "${BackupStatus_AccessKey:-}"
      BackupStatus__SecretKey: "${BackupStatus_SecretKey:-}"
    depends_on:
      keycloak:
        condition: "service_started"
    networks:
      - "dokploy-network"
    restart: "unless-stopped"
    deploy:
      replicas: 1
      update_config:
        delay: "5s"
        failure_action: "rollback"
        order: "start-first"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "30s"
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "Host(`skoleoverblikket.dk`) && PathPrefix(`/api`)"
      traefik.http.routers.api.priority: "10"
      traefik.http.routers.api.entrypoints: "websecure"
      traefik.http.routers.api.tls.certresolver: "letsencrypt"
      traefik.http.services.api.loadbalancer.server.port: "8080"
  web:
    image: "${WEB_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-web:latest}"
    depends_on:
      api:
        condition: "service_healthy"
    networks:
      - "dokploy-network"
    restart: "unless-stopped"
    deploy:
      replicas: 1
      update_config:
        delay: "5s"
        failure_action: "rollback"
        order: "start-first"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-sf"
        - "http://localhost:80"
      interval: "10s"
      timeout: "5s"
      retries: 6
      start_period: "10s"
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`skoleoverblikket.dk`)"
      traefik.http.routers.web.priority: "1"
      traefik.http.routers.web.entrypoints: "websecure"
      traefik.http.routers.web.tls.certresolver: "letsencrypt"
      traefik.http.services.web.loadbalancer.server.port: "80"
networks:
  dokploy-network:
    external: true
  backup-agent:
    driver: "bridge"
volumes:
  skoleoverblikket-pgdata-a:
    external: true
  skoleoverblikket-pgdata-b:
    external: true
  skoleoverblikket-pg-control:
    external: true
  skoleoverblikket-pg-socket:
    external: true
  skoleoverblikket-wal-receive:
    external: true
  skoleoverblikket-backup-agent-state:
    external: true

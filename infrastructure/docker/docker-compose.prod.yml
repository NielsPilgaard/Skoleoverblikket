# Production stack on the OVH VPS, deployed by Dokploy behind its Traefik. Hand-written: the Aspire
# AppHost is the dev stack only and may drift from this file. When a change there matters in prod
# (a new service, environment variable or volume), add it here too.
#
# Every ${VAR} is set in Dokploy; docs/DEPLOYMENT.md lists them. Dokploy's variable is the config key
# with single underscores: Stripe_SecretKey for Stripe__SecretKey. deploy.mjs swaps API_IMAGE,
# WEB_IMAGE and KEYCLOAK_IMAGE on every deploy. Postgres and the backup agent only start with
# COMPOSE_PROFILES=selfhosted-db (task 54 cutover).
#
# The external volumes ARE the database. Never delete them. The backup console says which pgdata
# volume is live; wal-receive holds WAL that may not be in the repo yet.
#
# CI checks the file with `docker compose config`. Check locally the same way before pushing:
#   docker compose -f infrastructure/docker/docker-compose.prod.yml config --quiet
name: skoleoverblikket

services:
  # One cluster for the app and Keycloak databases (task 54 D2). No published port: only
  # dokploy-network reaches it. Started on /pgdata/a or /pgdata/b by the backup agent's A/B marker
  # (infrastructure/backup-agent/README.md).
  postgres:
    # Pinned to sha-<main commit> (CI publishes it on every push to main), not set in Dokploy, so a
    # normal deploy never restarts the database and an upgrade is a reviewed PR. Separate from the
    # agent's tag, so upgrading the agent doesn't restart Postgres. PR #35 merge commit.
    image: ghcr.io/nielspilgaard/skoleoverblikket-postgres:sha-af85693a0235c8490b1ad2736ab30a89c04bf858
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # initdb/10-roles.sh creates the app and Keycloak roles with these passwords.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    volumes:
      - skoleoverblikket-pgdata-a:/pgdata/a
      - skoleoverblikket-pgdata-b:/pgdata/b
      - skoleoverblikket-pg-control:/pg-control
      - skoleoverblikket-pg-socket:/var/run/postgresql
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-2g}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - selfhosted-db
    stop_grace_period: 60s

  # No bootstrap admin: master realm admins are personal users with OTP, and kc.sh bootstrap-admin is
  # the break-glass (docs/DEPLOYMENT.md). The master realm and its console answer 403 on the public
  # host and are reached through an SSH tunnel to 127.0.0.1:8180. /admin/realms/* stays public,
  # because the API calls the admin REST API there with its app-realm service account.
  # Realms and themes are baked into the prod image.
  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://auth.skoleoverblikket.dk
      KC_HOSTNAME_ADMIN: http://localhost:8180
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        delay: 30s
        failure_action: rollback
        order: start-first
    # bash's /dev/tcp, because the Keycloak and API images have no curl.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`auth.skoleoverblikket.dk`)
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.routers.keycloak.tls.certresolver=letsencrypt
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      # An allowlist only Traefik's own loopback matches, so every public request gets a 403.
      - traefik.http.routers.keycloak-master.rule=Host(`auth.skoleoverblikket.dk`) && (PathPrefix(`/realms/master`) || PathPrefix(`/admin/master`))
      - traefik.http.routers.keycloak-master.priority=100
      - traefik.http.routers.keycloak-master.entrypoints=websecure
      - traefik.http.routers.keycloak-master.tls.certresolver=letsencrypt
      - traefik.http.routers.keycloak-master.middlewares=keycloak-master-deny
      - traefik.http.routers.keycloak-master.service=keycloak
      - traefik.http.middlewares.keycloak-master-deny.ipallowlist.sourcerange=127.0.0.1/32

  # Streams WAL and takes backups, runs the drill, and serves the restore console. Not on
  # dokploy-network: it reaches Postgres only through the socket volume. The console is published on
  # the host's 127.0.0.1 only, for the SSH tunnel. No depends_on: the console must come up when
  # Postgres is broken.
  backup-agent:
    # Pinned like postgres above. PR #35 merge commit.
    image: ghcr.io/nielspilgaard/skoleoverblikket-backup-agent:sha-af85693a0235c8490b1ad2736ab30a89c04bf858
    environment:
      Agent__SshTunnelCommand: ${BACKUP_CONSOLE_SSH:-}
      Agent__VolumeNamePrefix: skoleoverblikket-pgdata-
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:-}
      OpsBucket__ServiceUrl: ${OpsBucket_ServiceUrl:-}
      OpsBucket__AccessKey: ${OpsBucket_AccessKey:-}
      OpsBucket__SecretKey: ${OpsBucket_SecretKey:-}
      Heartbeats__Wal: ${Heartbeats_Wal:-}
      Heartbeats__Backup: ${Heartbeats_Backup:-}
      Heartbeats__Drill: ${Heartbeats_Drill:-}
      Heartbeats__Verify: ${Heartbeats_Verify:-}
      Heartbeats__ElmahIo__ApiKey: ${Heartbeats_ElmahIo_ApiKey:-}
      Heartbeats__ElmahIo__LogId: ${Heartbeats_ElmahIo_LogId:-}
      # Not empty when unset: an empty enum fails binding, and an empty suffix would turn failures into successes.
      Heartbeats__Provider: ${Heartbeats_Provider:-ElmahIo}
      Heartbeats__Ping__FailSuffix: ${Heartbeats_Ping_FailSuffix:-/fail}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - skoleoverblikket-pg-socket:/var/run/postgresql
      - skoleoverblikket-pgdata-a:/pgdata/a
      - skoleoverblikket-pgdata-b:/pgdata/b
      - skoleoverblikket-pg-control:/pg-control
      - skoleoverblikket-wal-receive:/wal-receive
      - skoleoverblikket-backup-agent-state:/var/lib/backup-agent
      - skoleoverblikket-drill:/drill
    networks:
      - backup-agent
    restart: unless-stopped
    # The drill restores to the drill volume on disk, not tmpfs, so the agent's memory stays flat as
    # the database grows: the temporary Postgres (128MB shared_buffers), pgBackRest and .NET.
    deploy:
      resources:
        limits:
          memory: ${BACKUP_AGENT_MEMORY:-1g}
    profiles:
      - selfhosted-db
    stop_grace_period: 30s

  api:
    image: ${API_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-api:latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__skoleoverblikket-db: ${DATABASE_URL}
      Keycloak__Authority: https://auth.skoleoverblikket.dk/realms/Skoleoverblikket
      Keycloak__Audience: skoleoverblikket-api
      Keycloak__WebClientId: ${Keycloak_WebClientId}
      Keycloak__AdminClientId: ${Keycloak_AdminClientId}
      Keycloak__AdminClientSecret: ${Keycloak_AdminClientSecret}
      ObjectStorage__ServiceUrl: ${ObjectStorage_ServiceUrl}
      ObjectStorage__AccessKey: ${ObjectStorage_AccessKey}
      ObjectStorage__SecretKey: ${ObjectStorage_SecretKey}
      ObjectStorage__DefaultBucketName: ${ObjectStorage_DefaultBucketName}
      ObjectStorage__PublicEndpoint: ${ObjectStorage_PublicEndpoint}
      ObjectStorage__PresignedUploadSigningKey: ${ObjectStorage_PresignedUploadSigningKey}
      Smtp__Username: ${Smtp_Username}
      Smtp__Password: ${Smtp_Password}
      Stripe__SecretKey: ${Stripe_SecretKey}
      Stripe__WebhookSecret: ${Stripe_WebhookSecret}
      Stripe__BasePriceIdMonthly: ${Stripe_BasePriceIdMonthly}
      Stripe__BasePriceIdYearly: ${Stripe_BasePriceIdYearly}
      Stripe__ModulePriceIds__ParentModule__Monthly: ${Stripe_ModulePriceIds_ParentModule_Monthly}
      Stripe__ModulePriceIds__ParentModule__Yearly: ${Stripe_ModulePriceIds_ParentModule_Yearly}
      Stripe__ModulePriceIds__BoardModule__Monthly: ${Stripe_ModulePriceIds_BoardModule_Monthly}
      Stripe__ModulePriceIds__BoardModule__Yearly: ${Stripe_ModulePriceIds_BoardModule_Yearly}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      ElmahIo__ApiKey: ${ElmahIo_ApiKey:-}
      ElmahIo__LogId: ${ElmahIo_LogId:-}
      # Same endpoint the agent writes to, so the two can't drift apart.
      BackupStatus__ServiceUrl: ${OpsBucket_ServiceUrl:-https://s3.rbx.io.cloud.ovh.net/}
      BackupStatus__AccessKey: ${BackupStatus_AccessKey:-}
      BackupStatus__SecretKey: ${BackupStatus_SecretKey:-}
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        delay: 5s
        failure_action: rollback
        order: start-first
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`skoleoverblikket.dk`) && PathPrefix(`/api`)
      - traefik.http.routers.api.priority=10
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8080

  web:
    image: ${WEB_IMAGE:-ghcr.io/nielspilgaard/skoleoverblikket-web:latest}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        delay: 5s
        failure_action: rollback
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`skoleoverblikket.dk`)
      - traefik.http.routers.web.priority=2
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80

  # Catch-all for the site and Keycloak, below their routers. While a container is replaced or not yet
  # healthy, Traefik has no router for it and sends requests here instead of answering 404. Pages get
  # the maintenance-page config below, which polls until the site is back; open tabs see X-Maintenance
  # and hold their API calls (web/src/api/outage.ts).
  maintenance:
    image: nginx:1.29-alpine
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 32m
    labels:
      - traefik.enable=true
      - traefik.http.routers.maintenance.rule=Host(`skoleoverblikket.dk`) || Host(`auth.skoleoverblikket.dk`)
      - traefik.http.routers.maintenance.priority=1
      - traefik.http.routers.maintenance.entrypoints=websecure
      - traefik.http.routers.maintenance.tls.certresolver=letsencrypt
      - traefik.http.services.maintenance.loadbalancer.server.port=80
    configs:
      - source: maintenance-page
        target: /usr/share/nginx/html/index.html
      - source: maintenance-nginx
        target: /etc/nginx/conf.d/default.conf

networks:
  dokploy-network:
    external: true
  backup-agent:
    driver: bridge

# External, so the names are exact (no project prefix, which would start an empty database) and
# `down -v` or Dokploy's "delete volumes" can't remove them. Create them once per server before the
# first deploy: scripts/create-prod-volumes.ps1 (docs/DEPLOYMENT.md). Compose refuses to start
# without them.
volumes:
  skoleoverblikket-pgdata-a:
    external: true
  skoleoverblikket-pgdata-b:
    external: true
  skoleoverblikket-pg-control:
    external: true
  skoleoverblikket-pg-socket:
    external: true
  skoleoverblikket-wal-receive:
    external: true
  skoleoverblikket-backup-agent-state:
    external: true
  skoleoverblikket-drill:
    external: true

# Inline, so the server needs nothing but this file, and changing a config recreates only the
# maintenance container. Compose interpolates content too: write a literal $ as $$.
# Keep the page self-contained: the site's fonts, images and scripts are down while it shows.
configs:
  maintenance-page:
    content: |
      <!DOCTYPE html>
      <html lang="da">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <title>Opdaterer… · Skoleoverblikket</title>
      <style>
        :root { --brand: #1f6321; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
          background: #f0f5f1; color: var(--ink);
          font: 16px/1.5 Lato, "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        main { width: 100%; max-width: 520px; text-align: center; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--brand); font: 700 20px/1 Georgia, serif; margin-bottom: 28px; }
        .brand svg { width: 26px; height: auto; }

        .week {
          background: #fff; border-radius: 14px; padding: 14px; margin: 0 auto 28px;
          box-shadow: 0 1px 3px rgb(0 0 0 / .06), 0 10px 30px rgb(31 99 33 / .08);
          display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
        }
        .day { font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
        .slot { height: 34px; border-radius: 6px; background: #f3f4f6; position: relative; overflow: hidden; }
        .lesson {
          position: absolute; inset: 0; display: grid; place-items: center; border-radius: 6px;
          font-size: 12px; font-weight: 700; opacity: 0; transform: scale(.6);
          transition: opacity .35s ease, transform .35s cubic-bezier(.34, 1.56, .64, 1);
        }
        .slot.on .lesson { opacity: 1; transform: scale(1); }

        h1 { font-size: 24px; margin: 0 0 8px; }
        p { margin: 0 0 6px; color: var(--muted); }
        .foot { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
        .status { font-size: 14px; color: var(--muted); min-width: 170px; }
        button {
          border: 0; background: var(--brand); color: #fff; font: inherit; font-size: 15px; font-weight: 700;
          padding: 10px 20px; border-radius: 8px; cursor: pointer;
        }
        button:hover { background: #174d19; }
        button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
        @media (prefers-reduced-motion: reduce) { .lesson { transition: none; } }
      </style>
      </head>
      <body>
      <main>
        <div class="brand">
          <svg viewBox="0 0 100 140" aria-hidden="true">
            <path d="M6 48 50 6l44 42" fill="none" stroke="currentColor" stroke-width="7"/>
            <rect x="12" y="58" width="76" height="76" rx="6" fill="none" stroke="currentColor" stroke-width="7"/>
            <path d="M38 60v72M62 60v72M14 84h72M14 108h72" stroke="#7db87d" stroke-width="4"/>
          </svg>
          Skoleoverblikket
        </div>

        <div class="week" data-week aria-hidden="true">
          <div class="day">Man</div><div class="day">Tir</div><div class="day">Ons</div><div class="day">Tor</div><div class="day">Fre</div>
        </div>

        <h1>Skemaet bliver lagt på plads</h1>
        <p>Vi er ved at opdatere Skoleoverblikket. Det tager som regel under et minut.</p>
        <p>Siden genindlæser selv, når vi er klar. Intet af det, du har gemt, går tabt.</p>

        <div class="foot">
          <span class="status" data-status aria-live="polite"></span>
          <button type="button" data-retry>Prøv igen nu</button>
        </div>
      </main>

      <script>
        // Decorative timetable: lessons pop in at random, then the week clears and starts over.
        (() => {
          const week = document.querySelector("[data-week]");
          const subjects = [
            ["Da", "#dcfce7", "#166534"], ["Ma", "#dbeafe", "#1e40af"], ["En", "#fef3c7", "#92400e"],
            ["Na", "#ede9fe", "#5b21b6"], ["Id", "#ffe4e6", "#9f1239"], ["Mu", "#cffafe", "#155e75"],
            ["Hi", "#fae8ff", "#86198f"], ["Bi", "#d9ead9", "#174d19"],
          ];
          const slots = [];
          for (let i = 0; i < 25; i++) {
            const slot = document.createElement("div");
            slot.className = "slot";
            slot.innerHTML = '<div class="lesson"></div>';
            week.append(slot);
            slots.push(slot);
          }
          const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

          function paint(slot) {
            const [label, bg, fg] = subjects[Math.floor(Math.random() * subjects.length)];
            const lesson = slot.firstChild;
            lesson.textContent = label;
            lesson.style.background = bg;
            lesson.style.color = fg;
            slot.classList.add("on");
          }

          if (reduced) {
            slots.forEach((s, i) => { if (i % 3 !== 2) paint(s); });
            return;
          }
          let order = [];
          setInterval(() => {
            if (!order.length) {
              slots.forEach((s) => s.classList.remove("on"));
              order = slots.map((_, i) => i).sort(() => Math.random() - 0.5).slice(0, 19);
              return;
            }
            paint(slots[order.pop()]);
          }, 220);
        })();

        // Polls the current URL with growing gaps. The fallback answers 503; the real site answers 200.
        (() => {
          const delays = [2, 3, 5, 8, 13, 20, 30];
          const status = document.querySelector("[data-status]");
          let attempt = 0, left = 0, timer = 0, busy = false;

          const say = (text) => { status.textContent = text; };

          async function check() {
            if (busy) return;
            busy = true;
            clearInterval(timer);
            say("Tjekker…");
            try {
              const res = await fetch(location.href, { cache: "no-store" });
              if (res.ok) {
                say("Klar! Genindlæser…");
                setTimeout(() => location.reload(), 700);
                return;
              }
            } catch {}
            busy = false;
            schedule();
          }

          function schedule() {
            const base = delays[Math.min(attempt++, delays.length - 1)];
            left = Math.max(1, Math.round(base * (0.85 + Math.random() * 0.3)));
            tick();
            timer = setInterval(tick, 1000);
          }

          function tick() {
            if (left <= 0) return check();
            say(`Prøver igen om $${left} sek.`);
            left--;
          }

          document.querySelector("[data-retry]").addEventListener("click", () => { attempt = 0; check(); });
          addEventListener("online", check);
          document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
          schedule();
        })();
      </script>
      </body>
      </html>
  maintenance-nginx:
    content: |
      # Every path answers 503: pages get the maintenance page, which polls until the site answers 200.
      # X-Maintenance tells open tabs (web/src/api/outage.ts) the API never saw the request, so it is safe to resend.
      server {
          listen 80;
          root /usr/share/nginx/html;

          add_header X-Maintenance 1 always;
          add_header Retry-After 10 always;
          add_header Cache-Control "no-store" always;

          error_page 503 /index.html;

          location = /index.html {
              internal;
          }

          location /api/ {
              default_type application/problem+json;
              return 503 '{"type":"https://tools.ietf.org/html/rfc9110#section-15.6.4","title":"Skoleoverblikket opdateres. Prøv igen om lidt.","status":503}';
          }

          location / {
              return 503;
          }
      }

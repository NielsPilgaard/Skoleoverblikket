server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Inherited by every location below, as long as none sets its own add_header.
    # No full CSP yet: Keycloak, S3 uploads and Stripe would each need an entry. frame-ancestors stops
    # other sites framing the app (clickjacking); the Keycloak check-sso iframe is same-origin.
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Invitation links carry their token in the path; other sites only see the origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Marketing pages are prerendered at build time (scripts/prerender.mjs).
    location = / {
        try_files /prerendered/index.html /index.html;
    }

    location / {
        try_files $uri /prerendered$uri.html $uri/ /index.html;
    }
}

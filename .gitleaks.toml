# Secret scanning config for gitleaks (pre-commit hook and CI). Extends the default rules.
# Every allowlist entry is a decision that the value is safe to publish: say why.
# Entries match by value, not path: gitleaks 8.28 ignores condition = "AND", so a path entry would let
# every finding in that path through, real secrets included. CI scans the whole history, so a value
# removed from the tree stays listed here.

[extend]
useDefault = true

[[allowlists]]
# Stripe test-mode secret keys for local dev (appsettings.Development.json, the Aspire AppHost). Kept on
# purpose: test mode moves no money. sk_live_ keys are still caught everywhere.
description = "Stripe test-mode secret keys"
regexes = ['''^sk_test_\w+$''']

[[allowlists]]
# whsec_ has no test/live marker, so only known values are listed: stubs and placeholders, and the
# signing secrets of the local Stripe CLI listener (test mode, paired with the sk_test_ keys above).
# A new whsec_ value is caught: check it is test mode before adding it here.
description = "Stripe webhook secrets that are stubs or test-mode"
regexes = [
	'''^whsec_(stub|CHANGE_ME|xxxx)$''',
	'''^whsec_bd68b4fb57148df7a0c9b86b3118eca2068bfb51d579747695978904892833c5$''',
	'''^whsec_M6Pw1cbQk2AR7cxMbBSV9jONhtmU2zFf$''',
]

[[allowlists]]
# docker-compose.staging.yml: the e2e stack runs only on CI runners, with throwaway credentials.
description = "Throwaway credentials in the e2e stack"
regexes = [
	'''^(staging-password|staging-admin-password|keycloak-password|skoleoverblikket-admin-secret|stub-secret|stub-signing-key|minioadmin|test)$''',
]

[[allowlists]]
# Not secrets: Keycloak URL tails in docker-compose.staging.yml, which the generic rule reads as values of
# "key..." settings (Keycloak__Authority: http://keycloak:8080/..., KC_DB_URL: ...keycloak-db:5432/keycloak).
description = "Keycloak URLs mistaken for keys"
regexes = ['''^(8080/realms/(Skoleoverblikket|Skoleplanen)|5432/keycloak)$''']

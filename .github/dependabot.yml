# Weekly update PRs, grouped per ecosystem so there are a few PRs a week, not dozens.
# Security updates (a known vulnerability) are opened right away, outside this schedule, once
# "Dependabot security updates" is on in the repo settings.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /api/Skoleoverblikket.Api
      - /api/tests/Skoleoverblikket.Api.IntegrationTests
      - /infrastructure/aspire/Skoleoverblikket.AppHost
      - /infrastructure/aspire/Skoleoverblikket.ServiceDefaults
      - /infrastructure/backup-agent
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Billing may move off Stripe (tasks/62-stripe-to-alunta.md); don't chase Stripe.net majors meanwhile.
      - dependency-name: Stripe.net
        update-types: ["version-update:semver-major"]
      # Swashbuckle is built against Microsoft.OpenApi 2.x; 3.x breaks spec generation at build time.
      # Drop this once Swashbuckle depends on 3.x.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
      # Stay on the .NET 10 (LTS) release train; a .NET 11 package on the .NET 10 shared framework mixes versions.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /api
      - /web
      - /infrastructure/backup-agent
      - /infrastructure/keycloak
      - /infrastructure/postgres
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # A new .NET major needs the projects retargeted (TargetFramework, packages) in the same PR;
      # the image bump alone ships a net10.0 app on a runtime that won't start it.
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

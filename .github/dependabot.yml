# Security updates only. open-pull-requests-limit: 0 turns off routine version-update PRs;
# security updates (a known vulnerability) still open right away, grouped into one PR per ecosystem.
# Needs "Dependabot security updates" on in the repo settings (it is).
# The ignore rules below also apply to security updates.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /api/Skoleoverblikket.Api
      - /api/tests/Skoleoverblikket.Api.IntegrationTests
      - /infrastructure/aspire/Skoleoverblikket.AppHost
      - /infrastructure/aspire/Skoleoverblikket.ServiceDefaults
      - /infrastructure/backup-agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      nuget:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Billing may move off Stripe (tasks/62-stripe-to-alunta.md); don't chase Stripe.net majors meanwhile.
      - dependency-name: Stripe.net
        update-types: ["version-update:semver-major"]
      # Swashbuckle is built against Microsoft.OpenApi 2.x; 3.x breaks spec generation at build time.
      # Drop this once Swashbuckle depends on 3.x.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
      # Stay on the .NET 10 (LTS) release train; a .NET 11 package on the .NET 10 shared framework mixes versions.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /api
      - /web
      - /infrastructure/backup-agent
      - /infrastructure/keycloak
      - /infrastructure/postgres
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      docker:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # A new .NET major needs the projects retargeted (TargetFramework, packages) in the same PR;
      # the image bump alone ships a net10.0 app on a runtime that won't start it.
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        applies-to: security-updates
        patterns: ["*"]

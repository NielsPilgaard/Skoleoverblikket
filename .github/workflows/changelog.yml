name: Changelog

# Every Monday Claude turns last week's `feat` commits into a Danish changelog entry
# (web/src/content/changelog.ts, shown on /nyheder) and adds any new user-facing feature
# to the landing page registry (web/src/content/features.tsx). Opens a PR for review;
# never pushes to main, since a push to main deploys (see ci.yml).
#
# Cost: same as nightly-improvement.yml. Claude usage comes from the subscription via
# CLAUDE_CODE_OAUTH_TOKEN, and weeks without new `feat` commits use none.

on:
  schedule:
    - cron: "0 3 * * 1"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Skip (zero Claude usage) while last week's PR is unreviewed or nothing new shipped.
      - name: Find new feat commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create changelog --repo "$GITHUB_REPOSITORY" --color 1D76DB \
            --description "Opened by the changelog workflow" --force
          echo "date=$(TZ=Europe/Copenhagen date +%F)" >> "$GITHUB_OUTPUT"

          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label changelog --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "Open changelog PR exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          since=$(grep -m1 -oE "date: '[0-9]{4}-[0-9]{2}-[0-9]{2}'" web/src/content/changelog.ts | grep -oE '[0-9-]{10}')
          if [ -z "$since" ]; then
            echo "Could not read the latest date from web/src/content/changelog.ts" >&2
            exit 1
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

          count=$(git log --since="${since}T23:59:59" --pretty=%s | grep -cE '^feat(\(|!|:)' || true)
          echo "$count feat commits since $since"
          if [ "$count" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js 24
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci
        working-directory: web

      - name: Run Claude
        id: claude
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            You are writing the weekly "Nyheder" (changelog) entry for Skoleoverblikket, Danish school admin
            software. Readers are school secretaries, teachers, principals and parents: busy, not technical.
            Read docs/PERSONAS.md first. Every sentence must make sense to Hanne, the 58-year-old school secretary.

            Steps:
            1. List what shipped: `git log --since="${{ steps.check.outputs.since }}T23:59:59" --pretty="%h %s"`.
               Read `git show --stat <sha>` and the diff of any commit whose user impact is unclear.
            2. Keep only changes a user would notice: new features, new options, clearly better screens, fixed bugs
               users hit. Drop refactors, tests, CI, docs, dependencies, SEO, performance work users can't feel,
               and anything only developers or the super admin backoffice see.
               If nothing is left, stop without changing files or opening a PR.
            3. Add ONE new entry at the top of the `changelog` array in web/src/content/changelog.ts:
               `date: '${{ steps.check.outputs.date }}'`, a short Danish title naming the biggest change, and one plain Danish sentence per
               change. Say what the user can now do, not how it was built. No technical words (API, endpoint,
               komponent, database, refaktor). Match the tone and length of the existing entries. At most 6 changes;
               merge small related ones.
            4. If a change is a whole new feature area that the landing page doesn't cover, add it to `features` in
               web/src/content/features.tsx (title, one or two sentence description for Hanne, an icon in the same
               style). If a new sidebar item was added, map its route in `sidebarRouteFeatures`, using an existing
               feature key, the new key, or null for plain setup pages. Do not rewrite existing features.
               Never promise more than the feature does: Danish schools read words like "vikardækning" or
               "fraværsregistrering" with specific expectations, so say exactly what it does and doesn't do.
            5. Verify: `npm --prefix web run lint` and `npm --prefix web run build 2>&1 | tail -n 40`. Fix any error.
            6. Create branch `changelog/${{ steps.check.outputs.date }}`, commit with message
               `docs(changelog): add ${{ steps.check.outputs.date }} entry`, push, and run
               `gh pr create --base main --label changelog --title "docs(changelog): Nyheder ${{ steps.check.outputs.date }}" --body "<body>"`.
               Body: the commits you included, the ones you left out and why (one line each), and any new feature card.

            Hard limits:
            - Only edit web/src/content/changelog.ts and web/src/content/features.tsx.
            - Never invent changes. Every sentence must trace back to a commit in the list.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Edit,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(npm --prefix web run lint:*),Bash(npm --prefix web run build:*),Bash(tail:*),Bash(head:*)"

      # Full output is hidden (public repo = public logs). Print only the commands
      # Claude ran, anything the allowlist blocked, and its final message.
      - name: Summarize Claude run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## Tool calls"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="assistant") | .message.content[]?
              | select(.type=="tool_use")
              | "- \(.name): \(.input.command // .input.pattern // .input.file_path // "" | tostring | .[0:200])"' "$LOG"
            echo "## Blocked by allowlist"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="result") | .permission_denials[]?
              | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' "$LOG"
            echo "## Final message"
            jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | .result // ""' "$LOG"
          } | tee -a "$GITHUB_STEP_SUMMARY"

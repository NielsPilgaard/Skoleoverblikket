name: CD
run-name: "CD: ${{ inputs.image_tag }}"

# Called by Staging after e2e passes, with the image tag CI actually published.
# Staging must pass the tag: its own head_sha can be a later [skip ci] commit that never
# got images built.
# workflow_dispatch is for manual deploys and rollbacks.
#
# Task 44: after deploying, CD watches prod for 15 minutes. If the watch fails, it redeploys the
# tag that was running before (unless a migration changed in between) and the run goes red, which
# emails the owner.
on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string

# One deploy at a time, so "the tag running before" is never another run's half-watched deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      HAS_SMOKE_USER: ${{ secrets.SMOKE_USER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the rollback step diffs migrations between the two shas

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail here, with a readable error, instead of deep inside Dokploy's docker pull.
      - name: Check images exist
        run: |
          missing=0
          for name in api web keycloak; do
            image="ghcr.io/nielspilgaard/skoleoverblikket-$name:$IMAGE_TAG"
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "Found $image"
            else
              echo "::error title=Image not found::$image does not exist in GHCR. Was it published by the CI run for this commit?"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy to production
        id: deploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          node infrastructure/scripts/deploy.mjs
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Record elmah.io deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_BY: ${{ github.actor }}
          ELMAHIO_DEPLOYMENT_API_KEY: ${{ secrets.ELMAHIO_DEPLOYMENT_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
        run: |
          export VERSION="${IMAGE_TAG#sha-}"
          export DESCRIPTION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq '.commit.message | split("\n")[0]' || true)
          node infrastructure/scripts/elmah-deployment.mjs

      - name: Install Playwright
        if: env.HAS_SMOKE_USER == 'true'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Watch for 15 minutes
        id: watch
        env:
          PREVIOUS_TAG: ${{ steps.deploy.outputs.previous_tag }}
          DEPLOYED_AT: ${{ steps.deploy.outputs.deployed_at }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          ELMAHIO_READ_API_KEY: ${{ secrets.ELMAHIO_READ_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
          ELMAH_MIN_ERRORS: ${{ vars.ELMAH_MIN_ERRORS }}
          ELMAH_SPIKE_FACTOR: ${{ vars.ELMAH_SPIKE_FACTOR }}
        run: |
          export EXPECTED_VERSION="${IMAGE_TAG#sha-}"
          export PREVIOUS_VERSION="${PREVIOUS_TAG#sha-}"
          node infrastructure/scripts/watch.mjs

      # Only when the watch itself found a problem: npm or Playwright install failing says
      # nothing about the deploy. The run stays red either way, so the owner gets GitHub's email.
      - name: Roll back to the previous tag
        if: failure() && steps.watch.outputs.reason != ''
        env:
          PREVIOUS_TAG: ${{ steps.deploy.outputs.previous_tag }}
          REASON: ${{ steps.watch.outputs.reason }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          ELMAHIO_DEPLOYMENT_API_KEY: ${{ secrets.ELMAHIO_DEPLOYMENT_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
        run: |
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "$IMAGE_TAG" ]; then
            echo "::error title=No rollback::No previous tag to roll back to. $IMAGE_TAG stays live."
            exit 1
          fi
          # CI migrates prod before publishing, so the schema is already the new one. Old code
          # against it may be worse than the bug: leave that call to a human.
          if ! git diff --quiet "${PREVIOUS_TAG#sha-}" "${IMAGE_TAG#sha-}" -- api/Skoleoverblikket.Api/Data/Migrations/; then
            echo "::error title=No rollback::Migrations changed between $PREVIOUS_TAG and $IMAGE_TAG (or the diff failed). $IMAGE_TAG stays live: $REASON"
            exit 1
          fi

          IMAGE_TAG="$PREVIOUS_TAG" node infrastructure/scripts/deploy.mjs
          VERSION="${PREVIOUS_TAG#sha-}" DESCRIPTION="Rollback from $IMAGE_TAG" node infrastructure/scripts/elmah-deployment.mjs
          EXPECTED_VERSION="${PREVIOUS_TAG#sha-}" WATCH_SECONDS=180 SMOKE_AT_SECONDS= ELMAHIO_READ_API_KEY= \
            node infrastructure/scripts/watch.mjs
          echo "## ↩️ Rolled back to \`$PREVIOUS_TAG\`: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Rolled back::$IMAGE_TAG failed the watch ($REASON). Production runs $PREVIOUS_TAG again."

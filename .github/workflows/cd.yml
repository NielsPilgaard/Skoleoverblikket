name: CD
run-name: "CD: ${{ inputs.image_tag }}"

# Called by Staging after e2e passes, with the image tag CI actually published.
# Staging must pass the tag: its own head_sha can be a later [skip ci] commit that never
# got images built.
# workflow_dispatch is for manual deploys and rollbacks.
#
# Task 44: after deploying, `watch` checks prod for 15 minutes. Passing records the version as
# last known good on the `production-verified` environment. Failing runs `rollback`, which
# redeploys last good (unless a migration is involved), freezes CD with a `deploy-freeze` issue
# and opens a revert PR.
on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string
      force:
        description: "Deploy even while a deploy-freeze issue is open"
        type: boolean
        default: false

# One deploy, watch or rollback at a time. Every prod deploy goes through this workflow, and a
# newer queued run replaces an older queued one, which is fine: the newer sha includes the older.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      issues: read
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
      deployed_at: ${{ steps.deployed_at.outputs.time }}
    steps:
      - name: Check for deploy freeze
        id: freeze
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force == true }}
        run: |
          issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --label deploy-freeze --state open --json number,title,url \
            --jq '.[] | "#\(.number) \(.title) \(.url)"')
          if [ -z "$issues" ]; then
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "::warning title=Deploy freeze overridden::$issues"
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Deploy skipped: CD is frozen::$issues"
            printf '## ⏸️ Deploy of `%s` skipped: CD is frozen\n\n%s\n\nClose the issue (or merge its revert PR), or run CD with `force: true`.\n' "$IMAGE_TAG" "$issues" >> "$GITHUB_STEP_SUMMARY"
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.freeze.outputs.frozen == 'false'

      - name: Setup Node.js 24
        if: steps.freeze.outputs.frozen == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Log in to GHCR
        if: steps.freeze.outputs.frozen == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail here, with a readable error, instead of deep inside Dokploy's docker pull.
      - name: Check images exist
        if: steps.freeze.outputs.frozen == 'false'
        run: |
          missing=0
          for name in api web keycloak; do
            image="ghcr.io/nielspilgaard/skoleoverblikket-$name:$IMAGE_TAG"
            if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
              echo "Found $image"
            else
              echo "::error title=Image not found::$image does not exist in GHCR. Was it published by the CI run for this commit?"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy to production
        id: deploy
        if: steps.freeze.outputs.frozen == 'false'
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: node infrastructure/scripts/deploy.mjs

      - name: Record deploy time
        id: deployed_at
        if: steps.deploy.outcome == 'success'
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Record elmah.io deployment
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_BY: ${{ github.actor }}
          ELMAHIO_DEPLOYMENT_API_KEY: ${{ secrets.ELMAHIO_DEPLOYMENT_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
        run: |
          export VERSION="${IMAGE_TAG#sha-}"
          export DESCRIPTION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq '.commit.message | split("\n")[0]' || true)
          node infrastructure/scripts/elmah-deployment.mjs

  watch:
    name: Watch production
    needs: [deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write
    env:
      HAS_SMOKE_USER: ${{ secrets.SMOKE_USER != '' }}
    outputs:
      reason: ${{ steps.watch.outputs.reason }}
      last_good_sha: ${{ steps.last_good.outputs.sha }}
      last_good_tag: ${{ steps.last_good.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Last good is read from production-verified, which only this job writes. The production
      # environment can't be used: GitHub marks this deploy a success there before it's verified.
      - name: Find last good version
        id: last_good
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${IMAGE_TAG#sha-}"
          # Read first: breaking out of a piped loop could SIGPIPE gh and fail the step (pipefail).
          rows=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production-verified&per_page=50" \
            --jq '.[] | [.id, .sha, (.payload.image_tag // "")] | @tsv')
          while IFS=$'\t' read -r id sha tag; do
            [ -z "$id" ] || [ "$sha" = "$current" ] && continue
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = "success" ]; then
              echo "Last good: $tag ($sha)"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$rows"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright
        if: env.HAS_SMOKE_USER == 'true'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Watch for 15 minutes
        id: watch
        env:
          EXPECTED_VERSION: ${{ inputs.image_tag }}
          LAST_GOOD_VERSION: ${{ steps.last_good.outputs.sha }}
          DEPLOYED_AT: ${{ needs.deploy.outputs.deployed_at }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          ELMAHIO_READ_API_KEY: ${{ secrets.ELMAHIO_READ_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
          ELMAH_MIN_ERRORS: ${{ vars.ELMAH_MIN_ERRORS }}
          ELMAH_SPIKE_FACTOR: ${{ vars.ELMAH_SPIKE_FACTOR }}
        run: |
          export EXPECTED_VERSION="${EXPECTED_VERSION#sha-}"
          node infrastructure/scripts/watch.mjs

      # A GitHub API hiccup here must not roll back a deploy that passed.
      - name: Record as last good
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(jq -n --arg ref "${IMAGE_TAG#sha-}" --arg tag "$IMAGE_TAG" \
            '{ref: $ref, environment: "production-verified", auto_merge: false, required_contexts: [], payload: {image_tag: $tag}, description: "Passed the CD watch"}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=success -f environment_url=https://skoleoverblikket.dk > /dev/null
          echo "## ✅ \`$IMAGE_TAG\` is now last known good" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Roll back
    needs: [deploy, watch]
    # Only when watch.mjs found a problem: setup steps failing (npm, GitHub API) says nothing
    # about the deploy.
    if: failure() && needs.watch.outputs.reason != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Roll back
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_GOOD_SHA: ${{ needs.watch.outputs.last_good_sha }}
          LAST_GOOD_TAG: ${{ needs.watch.outputs.last_good_tag }}
          WATCH_REASON: ${{ needs.watch.outputs.reason }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          ELMAHIO_DEPLOYMENT_API_KEY: ${{ secrets.ELMAHIO_DEPLOYMENT_API_KEY }}
          ELMAHIO_LOG_ID: ${{ vars.ELMAHIO_LOG_ID }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          export SHA="${IMAGE_TAG#sha-}"
          node infrastructure/scripts/rollback.mjs

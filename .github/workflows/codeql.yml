name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CI: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          # Manual build: build-mode none misses source-generated code and drops
          # C# analysis quality below CodeQL's thresholds.
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C#
        if: matrix.language == 'csharp'
        run: |
          dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj
          dotnet build api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj
          dotnet build infrastructure/backup-agent/Skoleoverblikket.BackupAgent.csproj

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

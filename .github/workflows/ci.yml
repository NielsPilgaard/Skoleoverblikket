name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CI: true

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj
          dotnet restore api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj
          dotnet restore infrastructure/backup-agent/Skoleoverblikket.BackupAgent.csproj

      - name: Verify (format + build)
        shell: pwsh
        run: pwsh scripts/verify.ps1 -SkipFrontend -SkipTests -SkipDocs

      - name: Enable tUnit HTML report artifact upload
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Build tests
        run: dotnet build api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj --no-build --configuration Release

      - name: Check OpenAPI spec is up to date
        run: |
          cp web/openapi/v1.json web/openapi/v1.json.committed
          dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj --no-restore --configuration Release -p:CI=true
          diff web/openapi/v1.json.committed web/openapi/v1.json || (echo "OpenAPI spec is stale — run 'dotnet build' and commit web/openapi/v1.json" && exit 1)

  web:
    name: Web — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Lint rules only. Formatting never fails CI: the .githooks pre-commit hook formats instead.
      - name: Lint
        run: npx biome lint src/
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  docs:
    name: Docs — ryni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ryni
        run: |
          curl -LsSf https://github.com/computerlovetech/ryni/releases/download/v0.2.2/ryni-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Broken local Markdown links and invalid SKILL.md metadata.
      - name: ryni check
        shell: pwsh
        run: pwsh scripts/verify.ps1 -SkipFrontend -SkipDotnet

  # Playwright against the compose stack, built from the PR's code. Runs in parallel with the
  # API job and takes about as long (~4 min), so it adds little wall-clock time.
  # Pushes to main get the same suite in Staging, against the published images, before deploy.
  e2e:
    name: E2E
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f api/Skoleoverblikket.Api/Data/Migrations/migration_script.sql

  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    needs: [api, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-api:latest
            ghcr.io/nielspilgaard/skoleoverblikket-api:sha-${{ github.sha }}

  publish-web:
    name: Publish web image
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-web:latest
            ghcr.io/nielspilgaard/skoleoverblikket-web:sha-${{ github.sha }}
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.skoleoverblikket.dk

  # Task 54/60. Not deployed by deploy.mjs: compose pins POSTGRES_IMAGE and BACKUP_AGENT_IMAGE to a
  # sha tag in Dokploy, so a normal deploy never restarts the database.
  publish-postgres:
    name: Publish Postgres image
    runs-on: ubuntu-latest
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infrastructure/postgres
          file: infrastructure/postgres/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-postgres:latest
            ghcr.io/nielspilgaard/skoleoverblikket-postgres:sha-${{ github.sha }}

  publish-backup-agent:
    name: Publish backup agent image
    runs-on: ubuntu-latest
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infrastructure/backup-agent/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-backup-agent:latest
            ghcr.io/nielspilgaard/skoleoverblikket-backup-agent:sha-${{ github.sha }}

  publish-keycloak:
    name: Publish Keycloak image
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infrastructure/keycloak
          file: infrastructure/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:sha-${{ github.sha }}

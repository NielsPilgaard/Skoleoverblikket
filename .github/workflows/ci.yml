name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CI: true

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj
          dotnet restore api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj

      - name: Verify (format + build)
        shell: pwsh
        run: pwsh scripts/verify.ps1 -SkipFrontend -SkipTests

      - name: Enable tUnit HTML report artifact upload
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Build tests
        run: dotnet build api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test --project api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj --no-build --configuration Release

      - name: Check OpenAPI spec is up to date
        run: |
          cp web/openapi/v1.json web/openapi/v1.json.committed
          dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj --no-restore --configuration Release -p:CI=true
          diff web/openapi/v1.json.committed web/openapi/v1.json || (echo "OpenAPI spec is stale — run 'dotnet build' and commit web/openapi/v1.json" && exit 1)

  web:
    name: Web — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Lint rules only. Formatting never fails CI: the autofix job commits it instead.
      - name: Lint
        run: npx biome lint src/
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  # Self-healing formatting: run the formatters and commit the result back to the branch.
  # [skip ci] + GITHUB_TOKEN means the fix commit starts no new CI run or deploy;
  # a formatting-only change doesn't need one. Fork PRs can't be pushed to, so they're skipped.
  autofix:
    name: Auto-format
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    concurrency:
      group: autofix-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Biome (safe fixes only)
        run: npx biome check --write src/ || true
        working-directory: web

      - name: dotnet format
        run: |
          dotnet format api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj || true
          dotnet format api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj || true

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: auto-format [skip ci]"
          git pull --rebase
          git push

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -f api/Skoleoverblikket.Api/Data/Migrations/migration_script.sql

  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    needs: [api, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-api:latest
            ghcr.io/nielspilgaard/skoleoverblikket-api:sha-${{ github.sha }}

  publish-web:
    name: Publish web image
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-web:latest
            ghcr.io/nielspilgaard/skoleoverblikket-web:sha-${{ github.sha }}
          build-args: |
            VITE_KEYCLOAK_URL=https://auth.skoleoverblikket.dk

  publish-keycloak:
    name: Publish Keycloak image
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infrastructure/keycloak
          file: infrastructure/keycloak/Dockerfile
          push: true
          tags: |
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:latest
            ghcr.io/nielspilgaard/skoleoverblikket-keycloak:sha-${{ github.sha }}

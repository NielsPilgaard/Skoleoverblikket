name: E2E

# Runs the full Playwright suite against the docker-compose staging stack on the runner.
# Called from CI on pull requests (images built here from the PR's code) and from Staging
# on main (images published by CI for that commit). The suite itself takes ~1 min; most of
# the job is building or pulling images and booting Keycloak.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Tag of the published API, Keycloak and web images (e.g. sha-<commit>). Empty: build them from the checked-out code."
        type: string
        default: ""
      ref:
        description: "Commit to check out. Empty: the triggering commit."
        type: string
        default: ""

env:
  COMPOSE_FILE: infrastructure/docker/docker-compose.staging.yml

jobs:
  e2e:
    name: E2E tests against staging stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ inputs.image_tag && format('ghcr.io/nielspilgaard/skoleoverblikket-api:{0}', inputs.image_tag) || 'skoleoverblikket-api-e2e:latest' }}
      KEYCLOAK_IMAGE: ${{ inputs.image_tag && format('ghcr.io/nielspilgaard/skoleoverblikket-keycloak:{0}', inputs.image_tag) || 'skoleoverblikket-keycloak-e2e:latest' }}
      # The published web image has the production Keycloak URL baked in. The staging compose
      # file overrides it at container start (KEYCLOAK_URL, web/runtime-config.sh).
      WEB_IMAGE: ${{ inputs.image_tag && format('ghcr.io/nielspilgaard/skoleoverblikket-web:{0}', inputs.image_tag) || 'skoleoverblikket-web-e2e:latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Log in to GHCR
        if: inputs.image_tag != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs in the background so Node dependencies install meanwhile.
      # Keycloak is the slow part (~45s boot), so on PRs its image builds first and it boots
      # while the API and web images build. Images build with the runner's default (docker
      # driver) builder, which writes straight into the local image store: no `--load` export.
      # `docker compose up -d --wait` then starts the rest and waits for every healthcheck.
      # Background processes live until the job ends.
      - name: Start staging stack in the background
        env:
          BUILD_IMAGES: ${{ inputs.image_tag == '' }}
        run: |
          build_images() {
            bake="docker buildx bake --file infrastructure/docker/docker-bake.e2e.hcl"
            ($bake keycloak && docker compose up -d keycloak postgres silo mailpit) &
            early=$!
            $bake api web || return
            wait "$early"
          }
          start_stack() {
            if [ "$BUILD_IMAGES" = true ]; then build_images; else docker compose pull api keycloak web; fi &&
              docker compose up -d --wait
          }
          # The step shell runs with -e, so capture the status in an `if` or a failure would
          # kill the subshell before it writes the exit file.
          (if start_stack > "$RUNNER_TEMP/compose-up.log" 2>&1; then status=0; else status=$?; fi
           echo "$status" > "$RUNNER_TEMP/compose-up.tmp"
           mv "$RUNNER_TEMP/compose-up.tmp" "$RUNNER_TEMP/compose-up.exit") &

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Only the headless shell, and no --with-deps: the runner's preinstalled Chrome already
      # brought the system libraries, and the apt step sometimes hung for 10+ minutes. Runs
      # while the stack boots, so it adds no time.
      - name: Install Playwright headless shell
        timeout-minutes: 3
        run: npx playwright install --only-shell chromium
        working-directory: web

      # Covers building or pulling the images too, so it is longer than the boot alone.
      - name: Wait for staging stack
        timeout-minutes: 15
        run: |
          while [ ! -f "$RUNNER_TEMP/compose-up.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/compose-up.log"
          exit "$(cat "$RUNNER_TEMP/compose-up.exit")"

      - name: Run Playwright e2e tests
        env:
          SKIP_ASPIRE: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          KEYCLOAK_ADMIN_PASSWORD: staging-admin-password
        run: npx playwright test --reporter=line,html
        working-directory: web

      # The stack only lives on this runner, so its server-side logs are gone once the job ends.
      # Print the API tail into the job log (visible via `gh run view --log-failed`) and keep
      # the full logs as an artifact.
      - name: Dump stack logs
        if: failure()
        run: |
          mkdir -p stack-logs
          for service in api keycloak web; do
            docker compose logs --no-color --timestamps "$service" > "stack-logs/$service.log" 2>&1 || true
          done
          echo "::group::API log (last 200 lines)"
          tail -n 200 stack-logs/api.log
          echo "::endgroup::"

      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-logs
          path: stack-logs/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

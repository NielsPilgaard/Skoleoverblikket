name: Nightly improvement

# Every night Claude makes one focused, verified improvement and opens a PR.
# Never pushes to main: a push to main runs migrations and deploys (see ci.yml).
#
# Cost: Actions minutes are free (public repo). Claude usage comes from the
# Pro/Max subscription via CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
# PRs are opened with the Claude GitHub App token, so CI runs on them.

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

concurrency:
  group: nightly-improvement
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Skip the whole run (zero Claude usage) while last night's PR is still unreviewed.
      - name: Check for open nightly PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create nightly-improvement --repo "$GITHUB_REPOSITORY" --color 0E8A16 \
            --description "Opened by the nightly improvement workflow" --force
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label nightly-improvement --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "Open nightly PR exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "area=$(( $(TZ=Europe/Copenhagen date +%-j) % 10 + 1 ))" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Europe/Copenhagen date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - name: Setup .NET 10
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 24
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci
        working-directory: web

      - name: Run Claude
        id: claude
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            DATE: ${{ steps.check.outputs.date }}

            You are running unattended at night. Make ONE focused, meaningful improvement to this codebase, verify it,
            and open a PR. Aim for the change a careful senior developer would make in an hour: worth reviewing,
            but small enough to review in five minutes.

            Focus areas:
            1. Encapsulation: AGENTS.md says ~29 controllers still inject AppDbContext and write to it directly. Move one
               small controller's (or one endpoint group's) data logic into its feature service, following the
               "Encapsulation" section exactly. Switch TestDataBuilder/tests to the service if entity creation moved.
            2. Bug fix: find and fix one real bug (wrong date/week math, null handling, off-by-one, missing tenant-scoped
               lookup, wrong status code). Add an integration test that fails without the fix.
            3. Test coverage: add integration tests for one endpoint or flow that has none and whose silent break
               would block Hanne (see docs/TESTING.md).
            4. Usability for Hanne: improve one screen in web/src: clearer Danish error message, a helpful empty state,
               a missing loading/disabled state, or a layout that breaks on a phone (see docs/PERSONAS.md).
            5. Performance: fix one N+1 query, over-fetching (load whole entities where a projection would do), or
               needless re-render/re-fetch in the web app.
            6. Dead code: remove unused functions, components, endpoints-without-callers, imports or files.
            7. Simplification: simplify one overly complex function or React component without changing behavior.
            8. Type safety: remove 'any', non-null assertions and loose types in one area of web/src.
            9. Accessibility: fix missing aria-labels, alt text, label associations or keyboard access on one page.
            10. Docs: fix stale statements in docs/ or AGENTS.md that no longer match the code.

            Start with area ${{ steps.check.outputs.area }}. If targeted searches find nothing worth changing there,
            move to the next area (wrap 10 -> 1). Stop after trying 3 areas.

            Steps:
            1. Run `gh pr list --label nightly-improvement --state all --limit 30 --json title,state` and do not repeat
               anything listed there (closed = rejected, don't retry it).
            2. Find one candidate. Search with Grep/Glob and read only the files you need. Read the relevant docs
               (AGENTS.md sections, docs/AUTHORIZATION.md, docs/TESTING.md) before changing code they govern.
            3. Make the change. Follow AGENTS.md conventions exactly.
            4. Verify what you touched (always pipe through `tail -n 40` to keep output short):
               - C#: `dotnet build api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj`, then
                 `dotnet format api/Skoleoverblikket.Api/Skoleoverblikket.Api.csproj`.
               - Tests: run the affected test class only:
                 `dotnet test --project api/tests/Skoleoverblikket.Api.IntegrationTests/Skoleoverblikket.Api.IntegrationTests.csproj -- --treenode-filter "/*/*/<TestClassName>/*"`
                 Docker is available for Testcontainers.
               - Web: `npm --prefix web run lint` and `npm --prefix web run build`.
               If verification fails and you can't fix it in three attempts, revert with `git checkout -- . && git clean -fd`
               and try the next area instead.
            5. Create branch `nightly/${{ steps.check.outputs.date }}`, commit with a Conventional Commits message, push,
               and run `gh pr create --base main --label nightly-improvement --title "<conventional title>" --body "<body>"`.
               Body: what changed, why it matters, how you verified it, and anything the reviewer should look at closely.

            Hard limits:
            - One concern per PR. At most ~10 files and ~300 changed lines (tests included).
            - Never touch: Migrations/, .github/, infrastructure/, scripts/, package.json, package-lock.json, *.csproj,
              Program.cs, global query filters, auth/authorization code, Stripe/billing code.
            - No new dependencies. No changes to API request/response shapes or routes (web/openapi/v1.json must not change).
            - Don't weaken or delete existing tests or assertions. New tests are welcome.
            - Behavior changes only for real bug fixes or usability improvements, and say so in the PR body.
            - If nothing is clearly worth changing, stop without opening a PR. A skipped night is fine; a pointless PR is not.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(dotnet build:*),Bash(dotnet format:*),Bash(dotnet test:*),Bash(npm --prefix web run lint:*),Bash(npm --prefix web run build:*),Bash(tail:*),Bash(head:*),Bash(ls:*),Bash(find:*),Bash(wc:*),Bash(jq:*)"

      # Full output is hidden (public repo = public logs). Print only the commands
      # Claude ran, anything the allowlist blocked, and its final message.
      - name: Summarize Claude run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## Tool calls"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="assistant") | .message.content[]?
              | select(.type=="tool_use")
              | "- \(.name): \(.input.command // .input.pattern // .input.file_path // "" | tostring | .[0:200])"' "$LOG"
            echo "## Blocked by allowlist"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="result") | .permission_denials[]?
              | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' "$LOG"
            echo "## Final message"
            jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | .result // ""' "$LOG"
          } | tee -a "$GITHUB_STEP_SUMMARY"
